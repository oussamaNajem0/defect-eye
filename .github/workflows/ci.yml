name: DefectEye CI Pipeline

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Set up the Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      # 3. Install dependencies and testing tools
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock black ruff

      # 4. Check code formatting with Black
      - name: Run Black Formatter Check
        run: black --check src/ tests/

      # 5. Check for linting errors with Ruff
      - name: Run Ruff Linter
        run: ruff check src/ tests/

      # 6. Run our Unit and Integration Tests
      - name: Run Pytest
        run: pytest tests/ -v